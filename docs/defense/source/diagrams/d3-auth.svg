<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Noto Sans, Noto Sans Bengali, DejaVu Sans, sans-serif"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8fa89b"/></marker><marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#14532d"/></marker><marker id="ara" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#9b1c1c"/></marker></defs><rect width="900" height="502" fill="#ffffff"/><rect x="7" y="12" width="176" height="34" rx="7" fill="#14532d" stroke="#14532d" stroke-width="1.4"/><text x="95.0" y="32.78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Browser</text><line x1="95" y1="46" x2="95" y2="454" stroke="#8fa89b" stroke-width="1" stroke-dasharray="4,4"/><rect x="212" y="12" width="176" height="34" rx="7" fill="#14532d" stroke="#14532d" stroke-width="1.4"/><text x="300.0" y="32.78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">POST /auth/login</text><line x1="300" y1="46" x2="300" y2="454" stroke="#8fa89b" stroke-width="1" stroke-dasharray="4,4"/><rect x="432" y="12" width="176" height="34" rx="7" fill="#14532d" stroke="#14532d" stroke-width="1.4"/><text x="520.0" y="32.78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">Prisma / DB</text><line x1="520" y1="46" x2="520" y2="454" stroke="#8fa89b" stroke-width="1" stroke-dasharray="4,4"/><rect x="642" y="12" width="176" height="34" rx="7" fill="#14532d" stroke="#14532d" stroke-width="1.4"/><text x="730.0" y="32.78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">auth.js (JWT)</text><line x1="730" y1="46" x2="730" y2="454" stroke="#8fa89b" stroke-width="1" stroke-dasharray="4,4"/><line x1="101" y1="74" x2="294" y2="74" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><text x="197.5" y="68" text-anchor="middle" font-size="9.2" font-weight="400" fill="#14211a">1. email + password (JSON)</text><polyline points="300,96 358,96 358,116 304,116" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#ara)"/><text x="368" y="106" text-anchor="start" font-size="9.2" font-weight="400" fill="#14211a">2. enforceRateLimit(&#x27;auth-login&#x27;, max 10 / 60s)</text><polyline points="300,130 358,130 358,150 304,150" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#ara)"/><text x="368" y="140" text-anchor="start" font-size="9.2" font-weight="400" fill="#14211a">3. Zod loginSchema.safeParse → 422 if invalid</text><line x1="306" y1="172" x2="514" y2="172" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><text x="410.0" y="166" text-anchor="middle" font-size="9.2" font-weight="400" fill="#14211a">4. user.findUnique({ email })</text><line x1="514" y1="202" x2="306" y2="202" stroke="#8fa89b" stroke-width="1.6" marker-end="url(#ar)"/><text x="410.0" y="196" text-anchor="middle" font-size="9.2" font-weight="400" fill="#14211a">5. User row (or null) + farmerProfile</text><polyline points="300,224 358,224 358,244 304,244" fill="none" stroke="#9b1c1c" stroke-width="1.4" marker-end="url(#arr)"/><text x="368" y="234" text-anchor="start" font-size="9.2" font-weight="400" fill="#14211a">6. status === SUSPENDED → 401</text><line x1="306" y1="266" x2="724" y2="266" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><text x="515.0" y="260" text-anchor="middle" font-size="9.2" font-weight="400" fill="#14211a">7. bcrypt.compare(password, passwordHash)</text><line x1="724" y1="296" x2="306" y2="296" stroke="#8fa89b" stroke-width="1.6" marker-end="url(#ar)"/><text x="515.0" y="290" text-anchor="middle" font-size="9.2" font-weight="400" fill="#14211a">8. true / false</text><line x1="306" y1="326" x2="724" y2="326" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><text x="515.0" y="320" text-anchor="middle" font-size="9.2" font-weight="400" fill="#14211a">9. signToken({ sub, role, email }) HS256</text><line x1="724" y1="356" x2="306" y2="356" stroke="#8fa89b" stroke-width="1.6" marker-end="url(#ar)"/><text x="515.0" y="350" text-anchor="middle" font-size="9.2" font-weight="400" fill="#14211a">10. JWT (exp = JWT_EXPIRES_IN, default 2h)</text><line x1="294" y1="386" x2="101" y2="386" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><text x="197.5" y="380" text-anchor="middle" font-size="9.2" font-weight="400" fill="#14211a">11. { access_token, user }</text><polyline points="95,408 153,408 153,428 99,428" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#ara)"/><text x="163" y="418" text-anchor="start" font-size="9.2" font-weight="400" fill="#14211a">12. localStorage: fairHarvestToken + fairHarvestUser</text><rect x="60" y="452" width="780" height="34" rx="7" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="450.0" y="472.456" text-anchor="middle" font-size="9.6" font-weight="700" fill="#b45309">পরবর্তী প্রতিটি protected request-এ:  Authorization: Bearer &lt;JWT&gt;  →  decodeToken() → requireUser / requireRole</text></svg>