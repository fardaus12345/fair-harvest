<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 678" width="800" height="678" font-family="Noto Sans, Noto Sans Bengali, DejaVu Sans, sans-serif"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8fa89b"/></marker><marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#14532d"/></marker><marker id="ara" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#9b1c1c"/></marker></defs><rect width="800" height="678" fill="#ffffff"/><rect x="150" y="16" width="600" height="46" rx="7" fill="#eef5f0" stroke="#14532d" stroke-width="1.4"/><text x="450.0" y="35.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">Farmer ছবি নির্বাচন করে</text><text x="450.0" y="50.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">ProductImageUploader.js</text><circle cx="122" cy="39" r="13" fill="#14532d"/><text x="122" y="43" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">1</text><line x1="450" y1="62" x2="450" y2="74" stroke="#8fa89b" stroke-width="1.4" marker-end="url(#ar)"/><rect x="150" y="76" width="600" height="46" rx="7" fill="#ffffff" stroke="#8fa89b" stroke-width="1.4"/><text x="450.0" y="95.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8fa89b">Client-side pre-check</text><text x="450.0" y="110.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">type ∈ {jpeg,png,webp} · ≤ 3 MB</text><circle cx="122" cy="99" r="13" fill="#8fa89b"/><text x="122" y="103" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">2</text><line x1="450" y1="122" x2="450" y2="134" stroke="#8fa89b" stroke-width="1.4" marker-end="url(#ar)"/><rect x="150" y="136" width="600" height="46" rx="7" fill="#eef5f0" stroke="#14532d" stroke-width="1.4"/><text x="450.0" y="155.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">POST /uploads/product-image</text><text x="450.0" y="170.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">multipart/form-data + Bearer JWT</text><circle cx="122" cy="159" r="13" fill="#14532d"/><text x="122" y="163" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">3</text><line x1="450" y1="182" x2="450" y2="194" stroke="#8fa89b" stroke-width="1.4" marker-end="url(#ar)"/><rect x="150" y="196" width="600" height="46" rx="7" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="450.0" y="215.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">requireUser + role gate</text><text x="450.0" y="230.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">শুধু VERIFIED farmer বা ADMIN — নাহলে 403</text><circle cx="122" cy="219" r="13" fill="#b45309"/><text x="122" y="223" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">4</text><line x1="450" y1="242" x2="450" y2="254" stroke="#8fa89b" stroke-width="1.4" marker-end="url(#ar)"/><rect x="150" y="256" width="600" height="46" rx="7" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="450.0" y="275.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">enforceRateLimit</text><text x="450.0" y="290.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">product-image-upload · 20 / 60s</text><circle cx="122" cy="279" r="13" fill="#b45309"/><text x="122" y="283" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">5</text><line x1="450" y1="302" x2="450" y2="314" stroke="#8fa89b" stroke-width="1.4" marker-end="url(#ar)"/><rect x="150" y="316" width="600" height="46" rx="7" fill="#ffffff" stroke="#8fa89b" stroke-width="1.4"/><text x="450.0" y="335.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8fa89b">validateImageUpload()</text><text x="450.0" y="350.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">MIME + size — SVG ইচ্ছাকৃতভাবে নিষিদ্ধ</text><circle cx="122" cy="339" r="13" fill="#8fa89b"/><text x="122" y="343" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">6</text><line x1="450" y1="362" x2="450" y2="374" stroke="#8fa89b" stroke-width="1.4" marker-end="url(#ar)"/><rect x="150" y="376" width="600" height="46" rx="7" fill="#ffffff" stroke="#8fa89b" stroke-width="1.4"/><text x="450.0" y="395.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8fa89b">buildStorageKey()</text><text x="450.0" y="410.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">products/&lt;randomUUID&gt;.&lt;ext&gt; — client filename ব্যবহার হয় না</text><circle cx="122" cy="399" r="13" fill="#8fa89b"/><text x="122" y="403" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">7</text><line x1="450" y1="422" x2="450" y2="434" stroke="#8fa89b" stroke-width="1.4" marker-end="url(#ar)"/><rect x="150" y="436" width="600" height="46" rx="7" fill="#eef1fb" stroke="#1e3a8a" stroke-width="1.4"/><text x="450.0" y="455.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">putObject() → provider</text><text x="450.0" y="470.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">STORAGE_PROVIDER: local disk | Vercel Blob</text><circle cx="122" cy="459" r="13" fill="#1e3a8a"/><text x="122" y="463" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">8</text><line x1="450" y1="482" x2="450" y2="494" stroke="#8fa89b" stroke-width="1.4" marker-end="url(#ar)"/><rect x="150" y="496" width="600" height="46" rx="7" fill="#eef5f0" stroke="#14532d" stroke-width="1.4"/><text x="450.0" y="515.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">{ image_url } ফেরত আসে</text><text x="450.0" y="530.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">ছবি এখনো কোনো product-এর সাথে যুক্ত নয়</text><circle cx="122" cy="519" r="13" fill="#14532d"/><text x="122" y="523" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">9</text><line x1="450" y1="542" x2="450" y2="554" stroke="#8fa89b" stroke-width="1.4" marker-end="url(#ar)"/><rect x="150" y="556" width="600" height="46" rx="7" fill="#14532d" stroke="#14532d" stroke-width="1.4"/><text x="450.0" y="575.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">POST/PATCH /products { image_url }</text><text x="450.0" y="590.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">DB-তে শুধু URL সংরক্ষিত হয়, কখনো bytes নয়</text><circle cx="122" cy="579" r="13" fill="#14532d"/><text x="122" y="583" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">10</text><rect x="150" y="620" width="600" height="44" rx="7" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="450.0" y="645.528" text-anchor="middle" font-size="9.8" font-weight="700" fill="#b45309">পুরোনো ছবি প্রতিস্থাপিত হলে storageKeyFromUrl() দিয়ে key বের করে deleteObject() — orphan file থাকে না</text></svg>