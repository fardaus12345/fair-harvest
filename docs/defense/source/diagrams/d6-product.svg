<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 332" width="900" height="332" font-family="Noto Sans, Noto Sans Bengali, DejaVu Sans, sans-serif"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#8fa89b"/></marker><marker id="arg" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#14532d"/></marker><marker id="ara" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b45309"/></marker><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#9b1c1c"/></marker></defs><rect width="900" height="332" fill="#ffffff"/><rect x="40" y="30" width="180" height="48" rx="7" fill="#ffffff" stroke="#8fa89b" stroke-width="1.4"/><text x="130.0" y="57.96" text-anchor="middle" font-size="11" font-weight="700" fill="#14211a">farmer submits form</text><line x1="220" y1="54" x2="258" y2="54" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><rect x="260" y="20" width="200" height="68" rx="7" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="360.0" y="43.1" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">POST /api/v1/products</text><text x="360.0" y="57.6" text-anchor="middle" font-size="8.8" font-weight="400" fill="#5a6b62">verified farmer only</text><text x="360.0" y="72.1" text-anchor="middle" font-size="8.8" font-weight="400" fill="#5a6b62">403 otherwise</text><line x1="460" y1="54" x2="500" y2="54" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><rect x="502" y="30" width="150" height="48" rx="7" fill="#eef5f0" stroke="#14532d" stroke-width="1.4"/><text x="577.0" y="58.68" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">ACTIVE</text><text x="577" y="96" text-anchor="middle" font-size="9.4" font-weight="400" fill="#5a6b62">marketplace-এ দৃশ্যমান · cart-এ যোগ করা যায়</text><polyline points="652,54 700,54 700,150" fill="none" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><rect x="620" y="152" width="160" height="48" rx="7" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="700.0" y="180.32" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">OUT_OF_STOCK</text><text x="700" y="216" text-anchor="middle" font-size="9.4" font-weight="400" fill="#5a6b62">তালিকায় নেই · order করা যায় না</text><polyline points="620,176 560,176 560,78" fill="none" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><text x="548" y="130" text-anchor="end" font-size="9" font-weight="400" fill="#5a6b62">আবার active</text><polyline points="502,66 420,66 420,150" fill="none" stroke="#9b1c1c" stroke-width="1.6" marker-end="url(#arr)"/><rect x="330" y="152" width="180" height="48" rx="7" fill="#fdecec" stroke="#9b1c1c" stroke-width="1.4"/><text x="420.0" y="180.32" text-anchor="middle" font-size="12" font-weight="700" fill="#9b1c1c">ARCHIVED</text><text x="420" y="130" text-anchor="middle" font-size="9" font-weight="400" fill="#9b1c1c">DELETE /products/{id}</text><text x="420" y="216" text-anchor="middle" font-size="9.4" font-weight="400" fill="#5a6b62">marketplace থেকে লুকানো · row মুছে যায় না</text><polyline points="330,176 250,176 250,250" fill="none" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><rect x="120" y="252" width="262" height="52" rx="7" fill="#eef5f0" stroke="#14532d" stroke-width="1.4"/><text x="251.0" y="274.28" text-anchor="middle" font-size="10.5" font-weight="700" fill="#14532d">Restore = PATCH { status: &#x27;active&#x27; }</text><text x="251.0" y="289.28" text-anchor="middle" font-size="9.3" font-weight="400" fill="#5a6b62">farmer বা admin করতে পারে</text><polyline points="382,278 560,278 560,200" fill="none" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><rect x="500" y="252" width="380" height="66" rx="7" fill="#eef1fb" stroke="#1e3a8a" stroke-width="1.4"/><text x="690.0" y=