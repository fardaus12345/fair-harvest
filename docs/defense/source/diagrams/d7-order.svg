ght="50" rx="7" fill="#eef5f0" stroke="#14532d" stroke-width="1.4"/><text x="660.0" y="128.96" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">CONFIRMED</text><rect x="738" y="100" width="128" height="50" rx="7" fill="#eef5f0" stroke="#14532d" stroke-width="1.4"/><text x="802.0" y="128.96" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">SHIPPED</text><line x1="582" y1="125" x2="594" y2="125" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><line x1="724" y1="125" x2="736" y2="125" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><polyline points="802,150 802,196" fill="none" stroke="#14532d" stroke-width="1.6" marker-end="url(#arg)"/><rect x="738" y="198" width="128" height="50" rx="7" fill="#14532d" stroke="#14532d" stroke-width="1.4"/><text x="802.0" y="226.96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">DELIVERED</text><polyline points="518,150 518,196" fill="none" stroke="#9b1c1c" stroke-width="1.6" marker-end="url(#arr)"/><rect x="454" y="198" width="128" height="50" rx="7" fill="#fdecec" stroke="#9b1c1c" stroke-width="1.4"/><text x="518.0" y="226.96" text-anchor="middle" font-size="11" font-weight="700" fill="#9b1c1c">CANCELLED</text><text x="600" y="172" text-anchor="middle" font-size="9" font-weight="400" fill="#5a6b62">যেকোনো পর্যায় থেকে</text><rect x="30" y="198" width="400" height="76" rx="7" fill="#eef1fb" stroke="#1e3a8a" stroke-width="1.4"/><text x="230.0" y="218.30599999999998" text-anchor="middle" font-size="9.6" font-weight="700" fill="#1e3a8a">checkout transaction যা করে:</text><text x="230.0" y="232.40599999999998" text-anchor="middle" font-size="8.4" font-weight="400" fill="#5a6b62">Order + OrderItem (nameSnapshot, unitPriceBdt) তৈরি</text><text x="230.0" y="246.50599999999997" text-anchor="middle" font-size="8.4" font-weight="400" fill="#5a6b62">Product.quantityKg decrement · Payment row · +20 reward point</text><text x="230.0" y="260.606" text-anchor="middle" font-size="8.4" font-weight="400" fill="#5a6b62">OrderStatusEvent(PENDING) · CartItem মুছে ফেলা</text><rect x="30" y="288" width="836" height="52" rx="7" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="448.0" y="317.456" text-anchor="middle" font-size="9.6" font-weight="700" fill="#b45309">প্রতিটি status পরিবর্তনে OrderStatusEvent যোগ হয়  ·  DELIVERED বা CANCELLED হলে সেই order-এর প্রতিটি farmer-এর reputation পুনরায় গণনা হয়  ·  DELIVERED হলেই customer review দিতে পারে</text><rect x="30" y="20" width="836" height="54" rx="7" fill="#14532d" stroke="#14532d" stroke-width="1.4"/><text x="448.0" y="50.6" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">PATCH /api/v1/orders/{orderId}/status  —  শুধু ADMIN, অথবা সেই order-এ নিজের item আছে এমন FARMER (403 otherwise)</text></svg>